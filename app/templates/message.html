{% extends "base.html" %}
{% block title %}{{ title }} | {{ site_name }}{% endblock %}
{% block content %}
  <main class="page narrow">
    <section class="top">
      <h1>{{ title }}</h1>
      <p class="tagline">{{ body }}</p>
      {% if link %}<div class="actions"><a class="btn primary" href="{{ link }}">{{ link_text }}</a></div>{% endif %}
    </section>
  </main>
{% endblock %}
