# =============================================================================
#  CONFERENCE DATA  -  this is the only file you normally need to edit.
# =============================================================================
#
#  HOW TO EDIT
#  - Each conference is one block starting with [[conference]].
#  - Dates are written YYYY-MM-DD with NO quotes, e.g.  submission = 2027-01-22
#  - If a date is not announced yet, just leave that line out (or put a # in
#    front of it). The site shows "TBA" and no reminder is sent for it.
#  - Lines starting with # are comments and are ignored.
#
#  DATE FIELDS YOU CAN USE (all optional)
#    abstract          abstract / paper registration deadline
#    submission        full paper deadline
#    commitment        ARR commitment deadline (NLP conferences)
#    rebuttal_start    reviews released / author response opens
#    rebuttal_end      author response closes
#    decision          accept / reject notification
#    conference_start  first day of the conference
#    conference_end    last day of the conference
#
#  OTHER FIELDS
#    areas             any of: "ML", "AI", "NLP", "Vision", "Systems", "AI for Science"
#    unverified        list of date fields that came from a third-party tracker
#                      rather than the official site, e.g. ["decision"].
#                      They are shown with an "unconfirmed" tag.
#    time_note         what time of day the deadline falls (default: end of day,
#                      Anywhere on Earth)
#    deadline_time_utc only if the deadline is NOT end-of-day Anywhere on Earth:
#                      the UTC clock time on the listed date, e.g. "22:59"
#    submission_label  custom wording for the submission row
#    note              free text shown on the card
#    tracker           the conference's short name(s) on the ccfddl tracker, used
#                      by the daily automatic sync (see sync_dates.py)
#
#  AUTOMATIC UPDATES
#  Every day sync_dates.py compares this file with the community tracker.
#  New and moved dates go live by themselves with an "auto-updated" tag; they
#  are stored in state/tracker.json, not here. To confirm one, type the date
#  into this file. Anything you type here always wins over the tracker.
# =============================================================================

[settings]
site_title = "Conference Deadlines 2027"
site_tagline = "Submission, rebuttal, decision and conference dates for the big ML, NLP, systems and AI-for-science venues."
# After you turn on GitHub Pages, paste your site address here so emails can link to it.
site_url = ""
# Optional: a link people can use to ask for reminders (a Google Form, or "mailto:you@example.com").
signup_url = ""
# The last day someone checked these dates against the official sites.
# Update it whenever you re-check; it is shown at the bottom of the page.
dates_verified = "Nov 19, 2026"
# Name shown as the sender of reminder emails.
email_from_name = "Conference Reminders"

# How many days before each kind of date a reminder goes out. 0 = on the day.
# Edit these lists to get more or fewer nudges.
[reminders]
abstract         = [7, 1]
submission       = [30, 7, 1]
commitment       = [7, 1]
rebuttal_start   = [0]
rebuttal_end     = [1]
decision         = [0]
conference_start = [30]


