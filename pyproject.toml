[project]
name = "paper-ddl-reminder"
version = "0.2.0"
description = "PaperDDL: conference deadlines with email reminders"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=22",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
