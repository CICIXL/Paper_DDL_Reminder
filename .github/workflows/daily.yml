# A backup trigger for the daily task, and a way to run it by hand.
#
# The app on Render already runs the task by itself every day. This workflow
# asks it to run again a little later. That is harmless: nobody is ever sent
# the same reminder twice. If the app's own clock ever fails, this still fires.
#
# It needs two repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL     the site's address, e.g. https://paperddl.com
#   TASK_TOKEN  the same value as TASK_TOKEN in the Render dashboard
name: Daily task

on:
  schedule:
    - cron: "47 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app to run the daily task
        env:
          APP_URL: ${{ secrets.APP_URL }}
          TASK_TOKEN: ${{ secrets.TASK_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$TASK_TOKEN" ]; then
            echo "APP_URL or TASK_TOKEN is not set yet. Nothing to do."
            exit 0
          fi
          curl --fail-with-body -sS -X POST --max-time 600 \
            -H "Authorization: Bearer $TASK_TOKEN" "${APP_URL%/}/tasks/daily"
