# This file tells GitHub to run the two Python scripts automatically:
#   - once every day
#   - whenever you edit conferences.toml
#   - whenever you press "Run workflow" on the Actions tab
name: Daily update

on:
  schedule:
    # 14:17 UTC every day = early morning on the US/Canada west coast.
    - cron: "17 14 * * *"
  push:
    branches: [main]
    paths:
      - "conferences.toml"
      - "*.py"
      - ".github/workflows/daily.yml"
  workflow_dispatch:

# Lets the job save the rebuilt page and the "already sent" log back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Pull new and moved dates from the community tracker. If the tracker is
      # unreachable, this step is skipped and everything else still runs.
      - name: Sync dates from the tracker
        continue-on-error: true
        run: |
          pip install --quiet pyyaml
          python3 sync_dates.py

      - name: Rebuild the website
        run: python3 build_site.py

      - name: Send reminder emails
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
        run: python3 send_reminders.py

      - name: Save the rebuilt page and the sent log
        if: always()
        run: |
          git config user.name "conference-reminders-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          git diff --cached --quiet || git commit -m "Daily update"
          git push
